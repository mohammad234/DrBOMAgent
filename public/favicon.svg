<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d6efd"/>
      <stop offset="100%" stop-color="#0a58ca"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Stethoscope tubing -->
  <path d="M20 14 V32 a12 12 0 0 0 24 0 V14"
        fill="none" stroke="#ffffff" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Earpieces -->
  <circle cx="20" cy="14" r="3" fill="#ffffff"/>
  <circle cx="44" cy="14" r="3" fill="#ffffff"/>
  <!-- Chestpiece head -->
  <circle cx="32" cy="48" r="7" fill="#ffffff"/>
  <circle cx="32" cy="48" r="3" fill="#0d6efd"/>
  <!-- Connecting line from tubing midpoint to chestpiece -->
  <line x1="32" y1="44" x2="32" y2="41" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
</svg>
